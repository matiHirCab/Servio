<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servio · Salón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
/* Vista de reconocimiento (F-1), la pantalla fija del encargado (docs/diseno-front.md,
   decisión 1): barra de estado arriba, el salón grande a la izquierda, la mesa elegida,
   los avisos y «Ahora» a la derecha, el dock de estados abajo. Dos modos sobre los mismos
   datos: la reconstrucción (mesas, sillas, personas y platos dibujados; el default) y el
   video (el último frame ya difuminado, con las capas encima), que el servidor solo
   ofrece con --web-video (decisión 2). La página se arma sola con /estado y se
   actualiza con /eventos (salon_web.py). Solo tema oscuro: se mira de reojo con la luz
   de un restaurante. */
[hidden]{display:none!important}
:root{
  --bg:#07080a; --surface:#121418; --surface-2:#1a1d22; --line:rgba(255,255,255,.08);
  --fg:#eef1f4; --fg-2:#9aa1ab; --fg-3:#5f6670; --accent:#3E8BFF;
  --lleno:#3EE08F; --comiendo:#F2C94C; --por_terminar:#FF8A3D; --vacio:#FF4D61;
  --f-display:"Barlow",ui-sans-serif,system-ui,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",ui-sans-serif,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--f-display);font-size:14px;font-weight:400;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.screen{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.label{font-family:var(--f-label);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}

.status{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:4px 4px 0}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand b{font-weight:300;font-size:26px;letter-spacing:.32em;text-transform:uppercase}
.brand span{color:var(--fg-2);font-size:14px}
.status-r{display:flex;gap:18px;align-items:center;color:var(--fg-2);font-size:14px;flex-wrap:wrap}
.status-r .time{color:var(--fg);font-size:22px;font-weight:300}
.live{display:inline-flex;align-items:center;gap:8px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--por_terminar);box-shadow:0 0 0 4px rgba(255,138,61,.18)}
.live.on i{background:var(--vacio);box-shadow:0 0 0 4px rgba(255,77,97,.18);animation:blink 2s infinite}
.live.wait i{background:var(--fg-3);box-shadow:none}
@keyframes blink{50%{opacity:.35}}
.modes{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.modes button{border:0;background:transparent;color:var(--fg-2);font-family:var(--f-label);font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:36px}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{position:relative;border-radius:22px;overflow:hidden;background:#0c0d10;border:1px solid var(--line);min-width:0}
.stage svg,.stage img{display:block;width:100%;height:auto}
.video{position:relative;aspect-ratio:4/3;max-width:100%;margin:0 auto;background:#000}
.video img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:saturate(.85) brightness(.9)}
.video svg{position:absolute;inset:0;width:100%;height:100%}
.video .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-2);font-weight:300;font-size:18px;text-align:center;padding:24px}
.cap{position:absolute;left:16px;bottom:12px;display:flex;gap:10px;align-items:center;pointer-events:none}
.cap .label{color:var(--fg-2)}
.cap i{width:8px;height:8px;border-radius:50%;background:var(--vacio)}
.svg-cap{font-family:var(--f-label);font-size:11px;letter-spacing:.16em;fill:#5f6670}
.svg-label{font-family:var(--f-display);font-size:15px;font-weight:500;fill:#eef1f4}
.svg-status{font-family:var(--f-label);font-size:13px;letter-spacing:.06em;fill:#9aa1ab}
.svg-status.sel{fill:#3E8BFF}
.svg-free{font-family:var(--f-label);font-size:12px;letter-spacing:.3em;fill:#5f6670}
.svg-empty{font-family:var(--f-display);font-size:18px;font-weight:300;fill:#9aa1ab}
.svg-tag{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;fill:#07080a;font-weight:600}
.tbl{cursor:pointer}
.tbl:focus{outline:none}
.tbl:focus-visible .tbl-top{stroke:#3E8BFF;stroke-opacity:1}
.changed{animation:pop 1.2s ease-out;transform-box:fill-box;transform-origin:center}  /* sin esto escala desde el origen del SVG */
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}

.side{display:grid;gap:14px;align-content:start;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.card.sel{border-color:rgba(62,139,255,.35)}
.card.warn{border-color:rgba(255,138,61,.45)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.card-h h2{font-size:18px}
.card-h small{font-family:var(--f-label);font-size:12px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.prow{display:grid;grid-template-columns:10px minmax(0,1fr) 92px;align-items:center;gap:10px;font-size:13px;color:var(--fg-2);padding:5px 0}
.prow i{width:10px;height:10px;border-radius:50%}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.prow .st{text-align:right}
.bar{grid-column:2/-1;height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:-2px}
.bar b{display:block;height:100%;border-radius:2px;transition:width .6s}
.muted{color:var(--fg-2);font-size:13px;margin:0}
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:0 0 12px}
.alert + .alert{border-top:1px solid var(--line);padding-top:12px}
.alert:last-child{padding-bottom:0}
.alert .sev{border-radius:2px}
.alert p{margin:0;font-size:15px;line-height:1.35}
.alert p small{display:block;color:var(--fg-2);font-size:13px;margin-top:3px}
.alert time{font-size:13px;color:var(--fg-3);white-space:nowrap}
.taken{display:inline-block;margin-top:6px;font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lleno)}
.taken.none{color:var(--por_terminar)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.metric .v{font-size:32px;font-weight:300;line-height:1.05}
.metric .v small{font-size:15px;color:var(--fg-2);margin-left:3px}

.dock{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 18px}
.legend{display:flex;gap:20px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:9px;font-size:14px}
.chip i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 12px currentColor}
.chip b{color:var(--fg);font-weight:500}
.conn{color:var(--fg-2);font-size:13px}
.conn.off{color:var(--por_terminar)}

@media (max-width:1000px){.screen{grid-template-columns:minmax(0,1fr)}}
/* celular: el salón arriba, las tarjetas abajo, el dock con los estados pegado al borde
   de abajo; los números de «Ahora» en una fila */
@media (max-width:620px){
  .screen{gap:12px}
  .status-r{gap:12px}
  .brand b{font-size:20px}
  .status-r .time{font-size:18px}
  #occupied{display:none}
  .dock{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));flex-wrap:nowrap;overflow-x:auto;gap:12px;padding:10px 14px}
  .legend{gap:14px;flex-wrap:nowrap}
  .chip span{white-space:nowrap}
  .conn{display:none}
  .metrics{grid-template-columns:1fr 1fr 1fr 1fr}
  .metric .v{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.changed,.live.on i{animation:none}.bar b{transition:none}}
</style>
</head>
<body>
<main class="screen">
  <header class="status">
    <div class="brand"><b>Servio</b><span id="local">Salón</span></div>
    <div class="status-r">
      <span class="live wait" id="live"><i></i><span id="live-text">Conectando</span></span>
      <span class="num" id="occupied"></span>
      <span class="modes" role="group" aria-label="Modo" id="modes" hidden>
        <button type="button" id="mode-recon" aria-pressed="true">Reconstrucción</button>
        <button type="button" id="mode-video" aria-pressed="false">Video</button>
      </span>
      <span class="time num" id="clock">--:--</span>
    </div>
  </header>

  <section class="stage" aria-label="Salón">
    <svg id="floor" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Reconstrucción del salón"></svg>
    <div class="video" id="video" hidden>
      <img id="cam" alt="Imagen de la cámara con las caras difuminadas" hidden>
      <div class="wait" id="cam-wait">Esperando la imagen de la cámara</div>
      <svg id="overlay" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Capas sobre la cámara"></svg>
      <div class="cap"><i></i><span class="label" id="cam-cap">Cámara · caras difuminadas en la computadora</span></div>
    </div>
  </section>

  <aside class="side">
    <div class="card sel" id="table-card"></div>
    <div class="card" id="alerts-card"></div>
    <div class="card" id="shift-card"></div>
  </aside>

  <footer class="dock">
    <div class="legend" id="legend"></div>
    <span class="conn" id="conn">Esperando la primera lectura</span>
  </footer>
</main>

<script>
"use strict";
const STATES = ["lleno", "comiendo", "por_terminar", "vacio"];  // los cuatro de la leyenda
// «tapado»: un estado que la página no conoce (un plato que el modelo no pudo ver, un
// esquema nuevo): gris neutro, nunca se dibuja como si fuera uno de los cuatro
const COLOR = {lleno:"#3EE08F", comiendo:"#F2C94C", por_terminar:"#FF8A3D", vacio:"#FF4D61", tapado:"#9aa3ad"};
const STATE_NAME = {lleno:"Lleno", comiendo:"Comiendo", por_terminar:"Por terminar", vacio:"Vacío", tapado:"Tapado"};
const TABLE_STATUS = {libre:"Libre", servida:"Servida", comiendo:"Comiendo", por_terminar:"Por terminar", terminada:"Terminó"};
const ALERT_TITLE = {
  mesa_terminada: n => `${n} terminó`,
  plato_vacio: n => `${n}: plato vacío`,
  plato_lleno_mucho: n => `${n} sigue con un plato lleno`,
};
const ALERT_COLOR = {mesa_terminada: COLOR.vacio, plato_vacio: COLOR.por_terminar, plato_lleno_mucho: COLOR.lleno};
const FILL = {lleno:.9, comiendo:.55, por_terminar:.18, vacio:0, tapado:.5};

const base = location.pathname.replace(/\/+$/, "");
let snap = null;          // última foto del salón
let receivedAt = 0;       // Date.now() cuando llegó
let prevStates = {};      // track_id → estado de la foto anterior, para marcar cambios
let selected = null;      // table_id elegida
let connected = false;
let everConnected = false;  // para distinguir «conectando» de «se cortó»
let mode = "recon";       // lo que se ve: "recon" | "video"; el video solo si el servidor lo ofrece (snap.video)
let wanted = "recon";     // lo que eligió la persona, recordado en el navegador
try { wanted = localStorage.getItem("salon-mode") === "video" ? "video" : "recon"; } catch (e) {}
const dirty = {floor:false, video:false};        // el modo oculto se dibuja recién al mostrarlo
const pending = {floor:new Set(), video:new Set()}; // los platos que tienen que latir en cada modo

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tableOf = id => snap ? snap.tables.find(t => t.id === id) : undefined;
const tableName = id => { const t = tableOf(id); return t ? t.name : id; };
const tableWaiter = id => (tableOf(id) || {}).waiter || null;
const dishName = (p, i) => p.dish || (i === undefined ? "Plato" : "Plato " + (i + 1));
const stateOf = p => STATES.includes(p.state) ? p.state : "tapado";  // un estado raro no rompe el dibujo
const occupied = t => t.plates.length > 0;
const alertTitle = (type, name) => (ALERT_TITLE[type] || (n => `${n}: aviso`))(name);
const alertColor = type => ALERT_COLOR[type] || "#9aa3ad";
const plainMessage = m => String(m ?? "").replace(/^[^\p{L}\p{N}]+/u, "");  // sin el emoji del mensaje de Telegram
const byAge = (a, b) => Date.parse(a.created_at) - Date.parse(b.created_at);  // el más viejo primero
const alertsOf = id => snap ? snap.alerts.filter(a => a.table_id === id).sort(byAge) : [];

// "ahora" en el reloj de las lecturas (en un video es el tiempo del video). Las horas
// vienen en UTC y se muestran en la del navegador, que es la del local.
function nowTs() { return snap ? Date.parse(snap.ts) + (Date.now() - receivedAt) : Date.now(); }
function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, Math.round((nowTs() - Date.parse(iso)) / 1000));
  if (s < 60) return `${s} s`;
  const m = Math.floor(s / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
const hhmm = ms => new Date(ms).toLocaleTimeString("es-UY", {hour: "2-digit", minute: "2-digit", hourCycle: "h23"});
function hash(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function rand(seed) { return () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822507) >>> 0) % 1000) / 1000; }

// ---------- dibujo ----------
function halos(prefix) {
  let out = "";
  for (const s of Object.keys(COLOR)) out += `<radialGradient id="${prefix}halo-${s}"><stop offset=".45" stop-color="${COLOR[s]}" stop-opacity=".55"/><stop offset="1" stop-color="${COLOR[s]}" stop-opacity="0"/></radialGradient>`;
  return out;
}
function defs() {
  return `<defs>
<radialGradient id="floorg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#22262c"/><stop offset="1" stop-color="#0c0d10"/></radialGradient>
<linearGradient id="tableg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3f47"/><stop offset=".55" stop-color="#2a2e34"/><stop offset="1" stop-color="#1f2227"/></linearGradient>
<linearGradient id="chairg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3036"/><stop offset="1" stop-color="#1a1c20"/></linearGradient>
<radialGradient id="plateg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#b9c0c8"/></radialGradient>
<linearGradient id="bodyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7aeb8"/><stop offset="1" stop-color="#6c737d"/></linearGradient>
<radialGradient id="headg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#eef1f4"/><stop offset="1" stop-color="#b3bac3"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
${halos("")}</defs>`;
}

function person(x, y, rot, s) {
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${(1.15 * s).toFixed(2)})">
<ellipse cx="0" cy="3" rx="24" ry="15" fill="#000" opacity=".35"/>
<path d="M-20 4 Q-20 -9 0 -9 Q20 -9 20 4 Q20 9 14 9 L-14 9 Q-20 9 -20 4Z" fill="url(#bodyg)" stroke="#ffffff" stroke-opacity=".1"/>
<circle cx="0" cy="1" r="8.5" fill="url(#headg)" stroke="#ffffff" stroke-opacity=".15"/></g>`;
}

function chair(x, y, side, s) {
  const [w, h] = side === "t" || side === "b" ? [44 * s, 32 * s] : [32 * s, 44 * s];
  return `<rect x="${(x - w / 2).toFixed(1)}" y="${(y - h / 2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${9 * s}" fill="url(#chairg)" stroke="#ffffff" stroke-opacity=".05"/>`;
}

// El anillo de un plato, centrado en el origen: halo del color del estado (hasta `haloR`),
// anillo tenue de radio `R` y encima el arco de cuánto queda (`fill_ratio`). Lo usan los
// dos modos: la reconstrucción (`plate`) y el video (`renderVideo`), con otros tamaños.
function ring(p, R, haloR, w, prefix = "", haloOpacity = 1) {
  const st = stateOf(p), col = COLOR[st], f = p.fill_ratio ?? FILL[st], circ = 2 * Math.PI * R;
  let o = `<circle r="${haloR.toFixed(1)}" fill="url(#${prefix}halo-${st})" opacity="${haloOpacity}"/>`;
  o += `<circle r="${R.toFixed(1)}" fill="none" stroke="${col}" stroke-opacity=".2" stroke-width="${w}"/>`;
  if (f > 0.02) o += `<circle r="${R.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${(w * 1.15).toFixed(2)}" stroke-linecap="round" stroke-dasharray="${(circ * f).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90)"/>`;
  return o;
}

// Un plato: el anillo, el plato con la comida como mancha; vacío lleva el punto arriba.
// Si cambió de estado en la última lectura, late.
function plate(p, x, y, r, changed) {
  const st = stateOf(p);
  const col = COLOR[st];
  const f = p.fill_ratio ?? FILL[st];
  const R = r + 5 * r / 17;
  let o = `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="${changed ? "changed" : ""}">`;
  o += ring(p, R, r + 16 * r / 17, 2);
  o += `<circle r="${r.toFixed(1)}" fill="url(#plateg)" stroke="#d8dde3" stroke-opacity=".5" stroke-width=".8"/>`;
  if (f > 0.02) {
    const rnd = rand(hash(p.id)), rr = (r - 5 * r / 17) * Math.sqrt(f), pts = [];
    for (let i = 0; i < 8; i++) {
      const a = 2 * Math.PI * i / 8 + rnd() * .4, k = rr * (.75 + rnd() * .3);
      pts.push(`${(k * Math.cos(a)).toFixed(1)},${(k * Math.sin(a)).toFixed(1)}`);
    }
    o += `<polygon points="${pts.join(" ")}" fill="#b98a5a" opacity=".85"/>`;
    o += `<circle cx="${(-rr * .25).toFixed(1)}" cy="${(-rr * .2).toFixed(1)}" r="${Math.max(1.5, rr * .3).toFixed(1)}" fill="#7fa65a" opacity=".8"/>`;
    o += `<circle r="2.3" cx="${R.toFixed(1)}" cy="0" fill="${col}" transform="rotate(${(-90 + 360 * f).toFixed(1)})"/>`;
  } else {
    o += `<path d="M${-6 * r / 17} ${3 * r / 17} q${4 * r / 17} ${-3 * r / 17} ${9 * r / 17} ${-1 * r / 17}" stroke="#b98a5a" stroke-opacity=".5" stroke-width="1.4" fill="none"/>`;
    o += `<circle r="2.6" cy="${(-R).toFixed(1)}" fill="${col}"/>`;
  }
  return o + `</g></g>`;
}

// Una etiqueta de color (el aviso de una mesa, el nombre de un plato). El ancho se
// estima por la cantidad de letras; `fitTags` lo ajusta al texto real ya dibujado.
const tagWidth = text => text.length * 7.2 + 22;  // estimado; `fitTags` lo ajusta al texto real
function tag(x, y, text, col, opacity = 1, anchor = "start", age = null, alt = null) {
  // `age` (ISO): la etiqueta termina en « · HACE X» y se actualiza cada segundo (refreshAges).
  // `alt`: otra `y` para cuando pisa a una etiqueta ya puesta (fitTags la baja ahí).
  if (age) text = `${text} · ${ago(age).toUpperCase()}`;
  const w = tagWidth(text), x0 = anchor === "end" ? -w : 0;
  return `<g class="tag" data-x="${x.toFixed(1)}" data-y="${y.toFixed(1)}" data-anchor="${anchor}"${alt !== null ? ` data-alt="${alt.toFixed(1)}"` : ""}${age ? ` data-age="${esc(age)}" data-base="${esc(text.slice(0, text.lastIndexOf(" · ")))}"` : ""} transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="${x0.toFixed(0)}" y="-11" width="${w.toFixed(0)}" height="22" rx="11" fill="${col}" fill-opacity="${opacity}"/><text x="${(x0 + w / 2).toFixed(0)}" y="4" text-anchor="middle" class="svg-tag">${esc(text)}</text></g>`;
}
const isHidden = el => el.closest("[hidden]") !== null;  // o un ancestro
// Mide cada etiqueta con la fuente real y la corre para que no se salga del svg (a los
// lados y arriba o abajo); después, dos que se pisan: la segunda baja a su `alt`, si lo
// tiene. Con `only` (un conjunto de etiquetas) solo las mide y corre a ellas: es lo que
// hace falta cuando cambió el texto de la edad, sin repasar todo el dibujo cada segundo.
function fitTags(svg, only = null) {
  if (isHidden(svg)) return;  // oculto: no se puede medir
  const vb = svg.viewBox && svg.viewBox.baseVal, vw = vb ? vb.width : Infinity, vh = vb ? vb.height : Infinity;

// el rectángulo de una etiqueta en las unidades del viewBox del svg

const alertTagText = (al, name) => alertTitle(al.type, name).toUpperCase();

function refreshAges(svg) {

// ---------- reconstrucción ----------
function renderFloor() {
  const svg = $("floor");
  if (!snap || !snap.tables.length) {
    svg.setAttribute("viewBox", "0 0 1000 560");
    const msg = snap ? "La cámara no ve mesas todavía" : "Esperando la primera lectura de la cámara";
    svg.innerHTML = defs() + `<rect width="1000" height="560" fill="url(#floorg)"/><rect width="1000" height="560" fill="url(#grid)"/>
<text x="500" y="280" text-anchor="middle" class="svg-empty">${msg}</text>
<text x="500" y="308" text-anchor="middle" class="svg-cap">LAS MESAS APARECEN SOLAS CUANDO LLEGA UNA LECTURA</text>`;
    pending.floor.clear();
    return;
  }
  const [fw, fh] = snap.frame;
  // las mesas en píxeles de la cámara; el dibujo encuadra solo la zona con mesas
  const T = snap.tables.map(t => ({t, x: t.box[0] * fw, y: t.box[1] * fh, w: t.box[2] * fw, h: t.box[3] * fh}));
  const minx = Math.min(...T.map(a => a.x)), miny = Math.min(...T.map(a => a.y));
  const maxx = Math.max(...T.map(a => a.x + a.w)), maxy = Math.max(...T.map(a => a.y + a.h));
  const W = 1000, M = 110, TOP = 120, MAXH = 640;  // más alto que ancho no: la pantalla se mira de lejos
  const k = Math.min((W - 2 * M) / Math.max(maxx - minx, 1), (MAXH - TOP - M) / Math.max(maxy - miny, 1));
  const H = Math.max(420, (maxy - miny) * k + TOP + M);
  const offX = M + (W - 2 * M - (maxx - minx) * k) / 2;
  const offY = TOP + Math.max(0, (H - TOP - M - (maxy - miny) * k) / 2);
  const sides = T.map(a => Math.min(a.w, a.h) * k).sort((a, b) => a - b);
  const s = clamp(sides[Math.floor(sides.length / 2)] / 120, .55, 1.3); // tamaño de sillas y personas
  const seat = 34 * s;

  let out = defs() + `<rect width="${W}" height="${H.toFixed(0)}" fill="url(#floorg)"/><rect width="${W}" height="${H.toFixed(0)}" fill="url(#grid)"/>
<path d="M20 20H980V${(H - 20).toFixed(0)}H20Z" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
<text x="36" y="44" class="svg-cap">${esc((snap.local + " · cámara " + snap.camera).toUpperCase())} · CENITAL</text>
<text x="964" y="44" text-anchor="end" class="svg-cap">EN VIVO${snap.interval ? " · CADA " + snap.interval + " s" : ""}</text>`;

  for (const a of T) {
    const t = a.t;
    const x0 = offX + (a.x - minx) * k, y0 = offY + (a.y - miny) * k, w = a.w * k, h = a.h * k;
    const sel = t.id === selected;
    // platos: con su caja de la cámara, o repartidos en la mesa si no la tienen
    const n = t.plates.length, cols = Math.ceil(Math.sqrt(n || 1)), rows = Math.ceil((n || 1) / cols);
    const P = t.plates.map((p, i) => {
      if (p.bbox) {
        const [bx, by, bw, bh] = p.bbox;
        return {p, x: offX + ((bx + bw / 2) * fw - minx) * k, y: offY + ((by + bh / 2) * fh - miny) * k,
                r: clamp(Math.min(bw * fw, bh * fh) * k / 2, 9, 60)};
      }
      const c = i % cols, r = Math.floor(i / cols);
      return {p, x: x0 + w * (c + .5) / cols, y: y0 + h * (r + .5) / rows, r: clamp(Math.min(w / cols, h / rows) * .3, 9, 40)};
    });
    // una persona por plato, del lado de la mesa más cercano al plato
    const people = [];
    if (t.people) for (const q of P) {
      const d = {t: q.y - y0, b: y0 + h - q.y, l: q.x - x0, r: x0 + w - q.x};
      const side = Object.keys(d).reduce((m, key) => d[key] < d[m] ? key : m, "t");
      const px = side === "l" ? x0 - seat : side === "r" ? x0 + w + seat : clamp(q.x, x0 + 18 * s, x0 + w - 18 * s);
      const py = side === "t" ? y0 - seat : side === "b" ? y0 + h + seat : clamp(q.y, y0 + 18 * s, y0 + h - 18 * s);
      if (people.some(o => o.side === side && Math.hypot(o.x - px, o.y - py) < 46 * s)) continue;
      people.push({side, x: px, y: py, rot: {t: 0, b: 180, l: -90, r: 90}[side]});
    }
    const status = TABLE_STATUS[t.status] || t.status;
    const hasTop = people.some(o => o.side === "t");
    const ly = hasTop ? y0 - seat - 30 * s : y0 - 14;

    out += `<g class="tbl" data-id="${esc(t.id)}" tabindex="0" role="button" aria-label="${esc(t.name)}, ${esc(status)}">`;
    out += `<rect x="${(x0 + 6).toFixed(1)}" y="${(y0 + 14).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="14" fill="#000" opacity=".55" filter="url(#soft)"/>`;
    for (const o of people) out += chair(o.x, o.y, o.side, s);
    if (sel) out += `<rect x="${(x0 - seat - 26 * s).toFixed(1)}" y="${(y0 - seat - 26 * s).toFixed(1)}" width="${(w + 2 * seat + 52 * s).toFixed(1)}" height="${(h + 2 * seat + 52 * s).toFixed(1)}" rx="26" fill="#3E8BFF" fill-opacity=".05" stroke="#3E8BFF" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="2 5"/>`;
    out += `<rect class="tbl-top" x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="14" fill="url(#tableg)" stroke="#ffffff" stroke-opacity="${sel ? .35 : .1}"/>`;
    out += `<rect x="${(x0 + 8).toFixed(1)}" y="${(y0 + 8).toFixed(1)}" width="${Math.max(0, w - 16).toFixed(1)}" height="${(h * .32).toFixed(1)}" rx="10" fill="#ffffff" opacity=".035"/>`;
    for (const q of P) out += plate(q.p, q.x, q.y, q.r, pending.floor.has(q.p.id));
    for (const o of people) out += person(o.x, o.y, o.rot, s);
    if (!n) out += `<text x="${(x0 + w / 2).toFixed(1)}" y="${(y0 + h / 2 + 4).toFixed(1)}" text-anchor="middle" class="svg-free">LIBRE</text>`;
    out += `<text x="${x0.toFixed(1)}" y="${ly.toFixed(1)}" class="svg-label">${esc(t.name)}${t.waiter ? " · " + esc(t.waiter) : ""}</text>`;
    out += `<text x="${(x0 + w).toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="end" class="svg-status${sel ? " sel" : ""}">${esc(status)}</text>`;
    const al = alertsOf(t.id)[0];  // el aviso más viejo de la mesa, debajo
    if (al) out += tag(x0, y0 + h + (people.some(o => o.side === "b") ? seat + 26 * s : 22), alertTagText(al, t.name), alertColor(al.type), 1, "start", al.created_at);
    out += `</g>`;
  }
  svg.setAttribute("viewBox", `0 0 ${W} ${H.toFixed(0)}`);
  svg.innerHTML = out;
  fitTags(svg);
  pending.floor.clear();
}

// ---------- video ----------
// El último frame difuminado (frame.jpg) con las capas encima: el recuadro, la etiqueta
// y el aviso abierto de cada mesa y, por plato con caja, el anillo del estado y el
// nombre. Un plato sin caja no se marca: solo se dibuja lo que la cámara ve de verdad.
let camKey = null;  // la lectura (hora + versión) cuyo frame.jpg se pidió; tras un reinicio la versión vuelve a 1
let videoWidth = 0;  // el ancho con que se dibujó el overlay (una unidad = un píxel)
let framePending = null;  // {version, blob} que llegó antes que su foto: se muestra cuando se dibuje
function renderVideo() {
  const svg = $("overlay");
  if (!snap) { svg.innerHTML = ""; return; }
  // la proporción es la de la imagen que llegó (si ya cargó), no la de las zonas: las cajas
  // vienen normalizadas y se dibujan sobre la imagen aunque la cámara tenga otra proporción
  const cam = $("cam"), size = cam.naturalWidth && !cam.hidden ? [cam.naturalWidth, cam.naturalHeight] : snap.frame;
  const [fw, fh] = size[0] > 0 && size[1] > 0 ? size : [4, 3];  // un tamaño roto no deja la capa en NaN
  // el viewBox no es la resolución de la cámara: una unidad es un píxel de la pantalla
  // (el ancho con que se muestra el video), así los trazos y las etiquetas miden lo mismo
  // con una webcam de 640 que con una de 1920, y en una cámara vertical angosta
  $("video").style.aspectRatio = `${fw} / ${fh}`;
  $("video").style.width = `min(100%, calc(72vh * ${(fw / fh).toFixed(4)}))`;  // una cámara vertical no más alta que la pantalla
  const VW = $("video").clientWidth || 1000, VH = VW * fh / fw;  // medido después de fijar el ancho
  videoWidth = VW;
  svg.setAttribute("viewBox", `0 0 ${VW} ${VH.toFixed(1)}`);
  $("cam-cap").textContent = `Cámara ${snap.camera} · caras difuminadas en la computadora`;
  const key = `${snap.ts}|${snap.version}`;
  // el frame de esta foto: si ya llegó (se adelantó a la SSE), se muestra; si no, se pide
  if (framePending && framePending.version === snap.version) { camKey = key; showFrame(framePending.blob, [fw, fh]); }
  else if (key !== camKey) { camKey = key; loadFrame([fw, fh]); }
  let out = `<defs>${halos("v")}</defs>`;
  for (const t of snap.tables) {
    const sel = t.id === selected, x0 = t.box[0] * VW, y0 = t.box[1] * VH, w = t.box[2] * VW, h = t.box[3] * VH;
    const status = TABLE_STATUS[t.status] || t.status;
    out += `<g class="tbl" data-id="${esc(t.id)}" tabindex="0" role="button" aria-label="${esc(t.name)}, ${esc(status)}">`;
    out += `<rect class="tbl-top" x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="10" fill="#3E8BFF" fill-opacity="${sel ? .08 : .02}" stroke="#ffffff" stroke-opacity="${sel ? .9 : .35}" stroke-width="2" stroke-dasharray="${sel ? "0" : "6 6"}"/>`;
    out += tag(x0 + 8, y0 + 16, `${t.name}${t.waiter ? " · " + t.waiter : ""} · ${status.toUpperCase()}`, "#e9edf2", .92);
    const al = alertsOf(t.id)[0];
    if (al) out += tag(x0 + 8, y0 + h - 16, alertTagText(al, t.name), alertColor(al.type), 1, "start", al.created_at, y0 + h + 14);
    for (const p of t.plates) {
      if (!p.bbox) continue;
      const [bx, by, bw, bh] = p.bbox;
      const px = (bx + bw / 2) * VW, py = (by + bh / 2) * VH, r = Math.min(bw * VW, bh * VH) / 2;
      const st = stateOf(p), col = COLOR[st], R = r + 6;
      out += `<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)})"><g class="${pending.video.has(p.id) ? "changed" : ""}">` + ring(p, R, R + 10, 2.5, "v", .8);
      const label = `${dishName(p)} · ${STATE_NAME[st].toUpperCase()}`;
      const left = px + R + 8 + tagWidth(label) > VW;  // a la izquierda si a la derecha no entra
      // arriba del anillo; si ahí pisa la etiqueta de un plato vecino, fitTags la baja (`alt`)
      out += `</g>` + tag(left ? -(R + 8) : R + 8, -(R - 2), label, col, 1, left ? "end" : "start", null, R + 14) + `</g>`;
    }
    out += `</g>`;

  pending.video.clear();
}
// El último frame del servidor, con la versión de su foto (X-Salon-Version). Se muestra
// solo bajo las capas de esa misma foto: si es el de la foto dibujada, ya; si es de una más
// nueva (la SSE viene en camino), queda esperando y se muestra cuando se dibuje; si es de
// una más vieja (una conexión lenta), se pide de nuevo. Nunca capas de una lectura sobre la
// imagen de otra, y una conexión lenta no se queda sin imagen. Sin `<img src>` directo: un
// error ahí deja el cuadro roto en vez de la imagen que había.
let shownUrl = null, loadingUrl = null;  // el blob que se ve y el que está cargando (se liberan: la pantalla queda prendida todo el turno)

  const done = shown => { fetching = false; if (frameWanted && shown !== (snap && snap.version)) { const d = frameWanted; frameWanted = null; loadFrame(d); } else frameWanted = null; };

    if (r.status === 503) $("cam-wait").textContent = "La imagen de la cámara no se pudo codificar (ver el log de Servio)";
    return r.ok ? r.blob().then(blob => [blob, +r.headers.get("X-Salon-Version")]) : null;
  }).then(got => {

    if (!version || version === snap.version) { showFrame(blob, drawn); return done(snap.version); }  // sin versión (un proxy la sacó): se muestra igual
    if (version > snap.version) framePending = {version, blob};  // su foto está por llegar

    if (Math.abs(cam.naturalWidth / cam.naturalHeight - drawn[0] / drawn[1]) > .01 && mode === "video") renderVideo();  // el frame viene achicado: solo importa la proporción
  };
  cam.onerror = () => { URL.revokeObjectURL(url); if (loadingUrl === url) loadingUrl = null; };  // no se pudo decodificar: queda la imagen anterior
  cam.src = url;
}

// ---------- panel ----------
function renderSide() {
  const t = tableOf(selected);
  if (!t) {
    $("table-card").innerHTML = `<div class="card-h"><h2>Mesa</h2></div><p class="muted">${snap && snap.tables.length ? "Tocá una mesa del salón para ver sus platos." : "Las mesas aparecen cuando llega la primera lectura."}</p>`;
  } else {
    const rows = t.plates.map((p, i) => {
      const st = stateOf(p), f = p.fill_ratio ?? FILL[st];
      return `<div class="prow"><i style="background:${COLOR[st]}"></i><span class="nm">${esc(dishName(p, i))}</span><span class="st">${STATE_NAME[st]}</span>
<div class="bar"><b style="width:${Math.round(f * 100)}%;background:${COLOR[st]}"></b></div></div>`;
    }).join("") || `<p class="muted">${t.people ? "Hay gente, sin platos." : "Mesa libre."}</p>`;
    const since = t.since ? "Sentados desde las " + hhmm(Date.parse(t.since)) : (t.people ? "Hay gente, sin platos" : "Libre");
    $("table-card").innerHTML = `<div class="card-h"><h2>${esc(t.name)}</h2><small>${t.waiter ? esc(t.waiter) + " · mozo" : esc(TABLE_STATUS[t.status] || "")}</small></div>
${rows}<div class="label num" style="margin-top:10px">${esc(since)} · ${t.plates.length} ${t.plates.length === 1 ? "plato" : "platos"}</div>`;
  }

  // los avisos del más viejo al más nuevo: el que lleva más tiempo esperando es el que hay que atender
  const alerts = snap ? [...snap.alerts].sort(byAge) : [];
  const taken = a => a.answered_by ? `<span class="taken">Voy · ${esc(a.answered_by)}</span>`
    : a.answered_by === null ? `<span class="taken none">Nadie respondió${(w => w ? " · " + esc(w) : "")(tableWaiter(a.table_id))}</span>`
    : "";  // el servidor no manda quién respondió (llega con C-5): no se dice nada
  $("alerts-card").className = "card" + (alerts.length ? " warn" : "");
  $("alerts-card").innerHTML = `<div class="card-h"><h2>Avisos</h2><span class="label num">${alerts.length} ${alerts.length === 1 ? "abierto" : "abiertos"}</span></div>` +
    (alerts.length ? alerts.map(a => `<div class="alert"><span class="sev" style="background:${alertColor(a.type)}"></span>
<p>${esc(alertTitle(a.type, tableName(a.table_id)))}<small>${esc(plainMessage(a.message))}</small>${taken(a)}</p><time class="num">${ago(a.created_at)}</time></div>`).join("")
      : `<p class="muted">Nada pendiente: todas las mesas atendidas.</p>`);

  const tables = snap ? snap.tables : [];
  const occ = tables.filter(occupied);
  const plates = tables.reduce((n, x) => n + x.plates.length, 0);
  const sinces = occ.map(x => x.since).filter(Boolean).map(s => (nowTs() - Date.parse(s)) / 60000);  // de las mismas mesas que «ocupadas»; el promedio se calcula acá
  const avg = sinces.length ? Math.round(sinces.reduce((a, b) => a + b, 0) / sinces.length) : null;
  $("shift-card").innerHTML = `<div class="card-h"><h2>Ahora</h2><span class="label">En el salón</span></div><div class="metrics">
<div class="metric"><div class="label">Mesas ocupadas</div><div class="v num">${occ.length}<small>de ${tables.length}</small></div></div>
<div class="metric"><div class="label">Platos en mesa</div><div class="v num">${plates}</div></div>
<div class="metric"><div class="label">Avisos abiertos</div><div class="v num">${alerts.length}</div></div>
<div class="metric"><div class="label">Tiempo en mesa</div><div class="v num">${avg ?? "–"}${avg !== null ? "<small>min</small>" : ""}</div></div></div>`;

  $("legend").innerHTML = STATES.map(s => `<span class="chip" style="color:${COLOR[s]}"><i style="background:${COLOR[s]}"></i><span>${STATE_NAME[s]} <b class="num">${snap ? snap.counts[s] : 0}</b></span></span>`).join("");
  $("occupied").textContent = snap ? `${occ.length} de ${tables.length} mesas ocupadas` : "";
  if (snap) $("clock").textContent = hhmm(nowTs());
  $("local").textContent = snap ? `${snap.local} · Salón` : "Salón";
  // pasadas 3 lecturas + 10 s sin novedades, la cámara se da por caída
  const late = snap && snap.interval && (Date.now() - receivedAt) / 1000 > 3 * snap.interval + 10;
  $("live").className = "live" + (!connected ? (everConnected ? "" : " wait") : late ? "" : snap ? " on" : " wait");
  $("live-text").textContent = !connected ? (everConnected ? "Reconectando" : "Conectando") : late ? "Sin lecturas" : snap ? "Cámara en vivo" : "Esperando lecturas";
  const conn = $("conn");
  conn.className = "conn" + (connected && !late ? "" : " off");
  conn.textContent = !connected ? (everConnected ? "Sin conexión con Servio, reintentando…" : "Conectando con Servio…")
    : !snap ? "Esperando la primera lectura"
    : `${late ? "Sin lecturas desde hace" : "Última lectura hace"} ${ago(snap.ts)}${snap.interval ? " · cada " + snap.interval + " s" : ""}`;
}

// la mesa a mostrar si no eligieron ninguna (o la elegida ya no está): la del aviso
// abierto más viejo, el que hay que atender; si no hay avisos, la primera ocupada
function pickTable() {
  if (!snap) return;
  if (selected && snap.tables.some(t => t.id === selected)) return;
  const oldest = snap.alerts.filter(a => tableOf(a.table_id)).sort(byAge)[0];  // de una mesa que siga en el salón
  selected = oldest ? oldest.table_id : (snap.tables.find(occupied) || snap.tables[0] || {}).id || null;
}

function render() {
  pickTable();
  // antes de redibujar: después el nodo ya no está en el documento
  const focused = document.activeElement && document.activeElement.closest ? document.activeElement.closest(".tbl") : null;
  const focusedSvg = focused ? focused.closest("svg") : null, focusedId = focused ? focused.dataset.id : null;
  if ($("floor").hasAttribute("hidden")) dirty.floor = true; else { renderFloor(); dirty.floor = false; }
  if ($("video").hasAttribute("hidden")) dirty.video = true; else { renderVideo(); dirty.video = false; }
  renderSide();
  if (focusedSvg && focusedId !== null) { const g = focusedSvg.querySelector(`.tbl[data-id="${CSS.escape(focusedId)}"]`); if (g && g.focus) g.focus(); }
}

function apply(data) {
  if (!data) return;
  const first = snap === null;
  snap = data; receivedAt = Date.now();
  // el segmento de modo solo si el servidor ofrece el frame (--web-video); el modo que
  // se muestra es el que eligió la persona (`wanted`) si el servidor lo ofrece
  $("modes").hidden = !snap.video;
  showMode(wanted === "video" && snap.video ? "video" : "recon");
  // lo que cambió de estado o es nuevo late una vez, en el modo que se ve (el oculto se
  // dibuja al mostrarlo sin latidos: lo que cambió mientras no se veía no es noticia);
  // la primera foto no late
  if (!first) for (const t of snap.tables) for (const p of t.plates) {
    if (prevStates[p.id] !== p.state) pending[mode === "video" ? "video" : "floor"].add(p.id);
  }
  prevStates = {};
  for (const t of snap.tables) for (const p of t.plates) prevStates[p.id] = p.state;
  render();  // dibuja el modo visible (y marca el otro para cuando se muestre)
}

// qué modo se ve (sin dibujar nada)
function showMode(m) {
  mode = m;
  $("floor").toggleAttribute("hidden", m !== "recon");
  $("video").toggleAttribute("hidden", m !== "video");
  $("mode-recon").setAttribute("aria-pressed", String(m === "recon"));
  $("mode-video").setAttribute("aria-pressed", String(m === "video"));
}
// la persona eligió un modo: se recuerda (aunque el servidor hoy no ofrezca el video) y
// se dibuja lo que estaba pendiente en el que se muestra
function chooseMode(m) {
  wanted = m;
  try { localStorage.setItem("salon-mode", m); } catch (e) {}
  showMode(m === "video" && snap && snap.video ? "video" : "recon");
  if (mode === "recon" && dirty.floor) { renderFloor(); dirty.floor = false; }
  // el overlay se dibuja a un píxel por unidad: si el ancho cambió mientras no se veía, de nuevo
  if (mode === "video" && (dirty.video || $("video").clientWidth !== videoWidth)) { renderVideo(); dirty.video = false; }
}
$("mode-recon").onclick = () => chooseMode("recon");
$("mode-video").onclick = () => chooseMode("video");

// el viewBox del video sigue al ancho: un redibujo por cuadro de animación, con el foco a salvo (render)
let resizing = false;
window.addEventListener("resize", () => {
  if (mode !== "video" || !snap || resizing) return;  // en reconstrucción, chooseMode lo redibuja al volver si cambió el ancho
  resizing = true;
  requestAnimationFrame(() => { resizing = false; render(); });
});
for (const id of ["floor", "overlay"]) {
  $(id).addEventListener("click", e => { const g = e.target.closest(".tbl"); if (!g) return; selected = g.dataset.id; render(); });
  $(id).addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest(".tbl"); if (!g) return;
    e.preventDefault(); selected = g.dataset.id; render();
  });
}

fetch(base + "/estado").then(r => r.json()).then(d => { connected = everConnected = true; apply(d); renderSide(); }).catch(() => {});
const events = new EventSource(base + "/eventos");
events.onopen = () => { connected = everConnected = true; renderSide(); };
events.onmessage = e => { connected = everConnected = true; apply(JSON.parse(e.data)); };
events.onerror = () => { connected = false; renderSide(); };
render();
setInterval(() => { renderSide(); refreshAges($("floor")); refreshAges($("overlay")); }, 1000);
// las etiquetas se midieron con la fuente de reserva: al llegar Barlow Condensed, de nuevo
if (document.fonts) document.fonts.ready.then(() => { fitTags($("floor")); fitTags($("overlay")); });
</script>
</body>
</html>
