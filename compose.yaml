# Servio en un servidor chico. Desde la raíz del repo:
#
#   docker compose up -d --build
#   docker compose logs -f servio
#
# Antes: .env con las claves (ver .env.example) y vision/config/zones.json con las mesas
# (con SERVIO_ZONES=config/zones.json en el .env: sin eso las mesas se detectan solas, A-1).
services:
  servio:
    build: .
    image: servio
    # Una cámara que se corta (o que no abre al arrancar) se reintenta sin tope y con
    # espera creciente: el programa no termina por eso. Lo que sí lo termina es un error
    # de configuración (zones.json o umbrales inválidos, una clave que falta): Docker lo
    # levanta de nuevo, con hasta 1 minuto entre intentos; mirá `docker compose logs`.
    # Al reiniciar, con una cámara en vivo, los avisos abiertos y los ids de los platos
    # se recuperan si pasaron menos de 10 min (tablas estado_servicio y estado_pipeline
    # de out/servio.db); si no, se arranca de cero.
    restart: unless-stopped
    environment:
      # Las rutas del .env son relativas a la raíz del repo; adentro se corre desde vision/.
      YOLO_WEIGHTS: /app/vision/models/best.pt
      # Adentro no hay `claude` CLI: el CLAUDE_PROVIDER=cli del .env no sirve acá.
      CLAUDE_PROVIDER: ${SERVIO_CLAUDE_PROVIDER:-anthropic}
      # En el servidor van los umbrales reales aunque el .env diga DEMO_MODE=true.
      DEMO_MODE: ${SERVIO_DEMO_MODE:-false}
    # La fuente (SERVIO_SOURCE, con la clave de la cámara: rtsp://usuario:clave@ip/stream)
    # NO va acá: el programa la lee del .env montado abajo. En `command` la clave
    # aparecería en `docker ps --no-trunc`, en `docker compose config` y en cualquier
    # captura que alguien pegue para pedir ayuda. Sin SERVIO_SOURCE en el .env, el
    # programa lo dice en el log y termina.
    command:
      - --classifier
      - ${SERVIO_CLASSIFIER:-hybrid}
    volumes:
      - ./.env:/app/.env:ro
      - ./vision/config:/app/vision/config:ro
      - ./vision/models:/app/vision/models:ro
      - ./vision/out:/app/vision/out
    # Cámara USB conectada al servidor (con --source 0): descomentar.
    # devices:
    #   - /dev/video0:/dev/video0
