name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vision:
    # Para usar runners de Tenki, cambiar `runs-on` por la etiqueta que indique su documentación.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Versiones fijas: `ruff format --check` cambia entre releases.
      - run: pip install -r requirements.txt pytest==9.1.1 ruff==0.17.1
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
