name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vision:
    # Para usar runners de Tenki, cambiar `runs-on` por la etiqueta que indique su documentación.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck   # cambiar a `npm run lint` + typecheck cuando llegue ESLint con Next
      - run: npm test
